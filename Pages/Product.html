<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalles del Producto</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../Styles/style.css" />
  </head>
  <body class="body-producto">
    <div class="container mt-4">
      <div class="row">
        <div class="col-12 col-lg-6">
          <div
            id="carouselExampleIndicators"
            class="carousel slide carousel-producto"
          >
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img
                  src="../Assets/audifono.webp"
                  class="d-block w-100"
                  alt="..."
                />
              </div>
              <div class="carousel-item">
                <img
                  src="../Assets/audifono1.webp"
                  class="d-block w-100"
                  alt="..."
                />
              </div>
              <div class="carousel-item">
                <img
                  src="../Assets/audifono2.webp"
                  class="d-block w-100"
                  alt="..."
                />
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-center gap-2 mt-3">
            <img
              src="../Assets/audifono.webp"
              class="thumb-img active"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="0"
              alt="Miniatura 1"
            />
            <img
              src="../Assets/audifono1.webp"
              class="thumb-img"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="1"
              alt="Miniatura 2"
            />
            <img
              src="../Assets/audifono2.webp"
              class="thumb-img"
              data-bs-target="#carouselExampleIndicators"
              data-bs-slide-to="2"
              alt="Miniatura 3"
            />
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <h2 class="mb-2" style="font-weight: bold">
            Auriculares Sony WH-1000XM5
          </h2>
          <div class="mb-3">
            <i class="fas fa-star me-1 text-warning"></i>
            <i class="fas fa-star me-1 text-warning"></i>
            <i class="fas fa-star me-1 text-warning"></i>
            <i class="fas fa-star me-1 text-warning"></i>
            <i class="fas fa-star me-1 text-warning"></i>
            <span class="ms-1">5</span>
            <span style="color: var(--gris-oscuro)">(789 opiniones)</span>
          </div>
          <del>$499,000</del>
          <h1 class="fw-bold mb-1" style="color: green">$399,000</h1>
          <span class="badge mb-2" style="background-color: green"
            >20% OFF</span
          >
          <div
            class="rounded p-3 mb-3 d-flex justify-content-between align-items-center flex-wrap"
            style="background-color: var(--gris-claro)"
          >
            <div>
              <p class="fw-bold mb-0">Vendido por Sony Store</p>
              <p class="mb-0" style="color: var(--verde)">
                <i class="fas fa-medal me-1"></i> MercadoLíder Gold
              </p>
            </div>
            <div class="text-end">
              <p class="mb-0" style="color: var(--verde)">
                <i class="fas fa-thumbs-up me-1"></i> 99% positivas
              </p>
              <p class="mb-0" style="color: var(--gris-oscuro)">5000 ventas</p>
            </div>
          </div>
          <p class="mb-3" style="color: var(--verde)">
            <span
              ><i class="fas fa-check-circle me-2 text-success"></i>Stock
              Disponible</span
            >
          </p>

          <p class="fw-bold mb-2">Cantidad:</p>
          <div class="d-flex align-items-center gap-2 mb-3">
            <button type="button" class="btn btn-outline-secondary">-</button>
            <span class="fw-bold px-2">1</span>
            <button type="button" class="btn btn-outline-secondary">+</button>
            <span class="ms-2" style="color: var(--gris-oscuro)"
              >(Stock disponible)</span
            >
          </div>

          <button
            type="button"
            class="btn w-100 mb-2 py-2 text-white"
            style="background-color: var(--celeste)"
          >
            Comprar ahora
          </button>
          <button
            type="button"
            class="btn btn-outline-primary w-100 mb-3 py-2"
            style="border-color: var(--celeste); color: var(--celeste)"
          >
            Agregar al carrito
          </button>

          <div class="border rounded p-3">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <p class="mb-0">
                  <i class="fas fa-truck me-1"></i>
                  <strong>Información de envío</strong>
                </p>
                <p class="mb-0">Envío gratis a todo el país</p>
              </div>
              <span class="fw-bold" style="color: var(--verde)">Gratis</span>
            </div>
            <p class="mt-2 mb-0" style="color: var(--gris-oscuro)">
              Llega entre el 15 y 20 de enero
            </p>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      const carousel = document.getElementById("carouselExampleIndicators");
      const thumbs = document.querySelectorAll(".thumb-img");

      carousel.addEventListener("slide.bs.carousel", (event) => {
        thumbs.forEach((t) => t.classList.remove("active"));
        thumbs[event.to].classList.add("active");
      });
    </script>
  </body>
</html>
