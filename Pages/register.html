<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta - MercadoLiebre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/Styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="login-page">

    <div class="container-fluid py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-6 col-lg-5">

                
                <div class="card shadow-sm p-4">
                <div class="image1 text-center mb-4 ">
                    <a href="index.html" class="text-decoration-none">
                         <img src="/Assets/icon-registro.png" alt="">
                    </a>
                </div>

                    <form>
                        <div class="row">
                            <div class="mb-3">
                                <input type="text" class="form-control" id="fullname" placeholder="Nombre y Apellido" required>
                            </div>
                            <div class="mb-3">
                                <input type="text" class="form-control" id="username" placeholder="Nombre de usuario" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <input type="email" class="form-control" id="email" placeholder="Email" required>
                        </div>

                        <div class="mb-3">
                            <label for="birthdate" class="form-label">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="birthdate" required>
                        </div>

                          <div class="mb-3">
                            <input type="text" class="form-control" id="domicilio" placeholder="Domicilio" required>
                        </div>

                        <div class="d-flex align-items-center justify-content-center gap-5 mb-3">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="accion" id="comprar">
                                <label class="form-check-label" for="comprar">Comprar</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="accion" id="vender">
                                <label class="form-check-label" for="vender">Vender</label>
                            </div>
                        </div>

                    <div class="gap-4">
                        <h5>Categorías</h5>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="html">
                            <label class="form-check-label" for="html">
                                Electro
                            </label>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="css">
                            <label class="form-check-label" for="css">
                                Moda
                            </label>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="javascript">
                            <label class="form-check-label" for="javascript">
                                Hogar
                            </label>
                        </div>
                        
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="javascript">
                            <label class="form-check-label" for="javascript">
                                Jugueteria
                            </label>
                        </div>
                        
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="javascript">
                            <label class="form-check-label" for="javascript">
                                Vida Sana
                            </label>
                        </div>
                    </div>    


                        <div class="mb-3">
                            <input type="password" class="form-control" id="passwordRegistro" placeholder="Contraseña" required>
                        </div>

                        <div class="mb-3">
                            <input type="password" class="form-control" id="confirmarPassword" placeholder="Confirmar contraseña" required>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="terminos" required>
                            <label class="form-check-label" for="terminos">
                                Acepto los <a href="#">términos y condiciones</a>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-3">Crear cuenta</button>
                        <button type="submit" class="btn btn-danger w-100">Borrar</button>
                    </form>

                    <hr class="my-4">

                    <p class="text-center mb-0">
                        ¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>   

</body>
</html>
